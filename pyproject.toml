[project]
name = "marvel5"
version = "0.1.0"
description = "Independent Python rewrite of the MARVEL algorithm: bootstrap+Dijkstra uncertainty plus combination-differences consistency checking"
authors = [
    { name = "Marco Barnfield", email = "mbarnfield63@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.6.1",
    "numpy>=2.5.0",
    "scipy>=1.18.0",
]

[project.scripts]
marvel5 = "marvel5.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
